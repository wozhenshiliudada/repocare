name: MVP safety tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: runtime/pi
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install -e ".[ui,test]"
      - run: python scripts/doctor.py --profile dev --json
      - run: python scripts/build-workbench-wheel.py --directory .demo/ui-wheel
      - run: python scripts/verify_workbench_wheel.py .demo/ui-wheel/wheels
      - run: python -m unittest discover -s tests -v
      - run: npm test
        working-directory: runtime/pi
      - run: python maintain.py demo --directory .demo/ci
      - run: python maintain.py evaluate --directory .demo/ci-evaluation
      - run: node runtime/pi/integration-replay.mjs --directory .demo/ci-integration
